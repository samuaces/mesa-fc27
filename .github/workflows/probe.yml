name: probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
concurrency:
  group: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p docs/debug
          curl -sSL -A "mesa-fc27 personal price reader (+https://github.com/samuaces/mesa-fc27)" -H "Accept-Language: en" "https://www.futwiz.com/en/fc27/squad-building-challenges" -o docs/debug/futwiz-sbc.html -w "%{http_code} %{size_download}\n"
          git config user.name "mesa-fc27 bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/debug; git commit -q -m "probe" || true
          git pull -q --rebase origin main && git push -q origin HEAD:main
